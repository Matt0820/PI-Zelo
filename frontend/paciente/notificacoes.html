<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos e Notificações | Zelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/zelo-design-system.css">
  <link rel="stylesheet" href="../styles/paciente.css">
</head>
<body style="background-color: var(--zelo-bg);">

  <div class="paciente-container">
    <header class="paciente-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="../images/logo.png" alt="Zelo" style="height: 42px; width: auto; background: white; padding: 4px; border-radius: 8px;">
        <div class="paciente-header-titles">
          <p id="paciente-header-cuidador">Avisos do Domicílio</p>
          <h1 id="paciente-header-nome">Sr. Leovegildo Nunes</h1>
        </div>
      </div>
      <div>
        <a href="index.html" class="btn btn-secondary" style="min-height: 38px; padding: 4px 12px; font-size: 0.85rem; color: #FFFFFF; background: transparent; border-color: rgba(255,255,255,0.4);">
          Voltar
        </a>
      </div>
    </header>

    <main class="paciente-body">
      <div style="margin-bottom: 18px;">
        <h1 style="font-size: 1.45rem; color: var(--zelo-primary); margin-bottom: 4px;">Avisos & Lembretes</h1>
        <p class="text-muted text-small">Comunicações da sua equipe de saúde e alertas de medicação em tempo real</p>
      </div>

      <!-- Filtro Rápido em Abas/Chips Amplos -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px;" role="tablist" aria-label="Filtrar avisos">
        <button type="button" class="btn btn-primary notif-filter-btn" data-filtro="todos" style="padding: 8px 14px; font-size: 0.9rem;">
          Todos
        </button>
        <button type="button" class="btn btn-secondary notif-filter-btn" data-filtro="medicamento" style="padding: 8px 14px; font-size: 0.9rem;">
          Remédios
        </button>
        <button type="button" class="btn btn-secondary notif-filter-btn" data-filtro="equipe" style="padding: 8px 14px; font-size: 0.9rem;">
          Equipe de Saúde
        </button>
        <button type="button" class="btn btn-secondary notif-filter-btn" data-filtro="alerta" style="padding: 8px 14px; font-size: 0.9rem;">
          Alertas
        </button>
      </div>

      <!-- Lista Dinâmica de Notificações -->
      <div id="lista-notificacoes" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="text-align: center; padding: 40px 16px; color: var(--zelo-text-muted);">
          Carregando avisos e lembretes da equipe de saúde...
        </div>
      </div>
    </main>

    <!-- Barra de Navegação Inferior (Mobile-First) -->
    <nav class="paciente-bottom-nav" aria-label="Navegação Principal do Aplicativo">
      <a href="index.html" class="bottom-nav-item">
        <span class="bottom-nav-tag">INÍCIO</span>
        <span>Início</span>
      </a>
      <a href="sintomas-passos.html" class="bottom-nav-item">
        <span class="bottom-nav-tag">ESAS</span>
        <span>Sintomas</span>
      </a>
      <a href="medicamentos.html" class="bottom-nav-item">
        <span class="bottom-nav-tag">Rx</span>
        <span>Remédios</span>
      </a>
      <a href="notificacoes.html" class="bottom-nav-item active" aria-current="page">
        <span class="bottom-nav-tag">AVISOS</span>
        <span>Avisos</span>
      </a>
      <a href="configuracoes.html" class="bottom-nav-item">
        <span class="bottom-nav-tag">PERFIL</span>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <script src="../scripts/acessibilidade.js"></script>
  <script src="../scripts/zelo-store.js"></script>
  <script>
    let filtroAtual = 'todos';

    function getPatientId() {
      return Number(localStorage.getItem('zelo_selected_patient_id') || 1);
    }

    function renderNotificacoes() {
      const container = document.getElementById('lista-notificacoes');
      if (!container) return;

      const patId = getPatientId();
      const paciente = ZeloStore.getPatientById(patId);

      // Atualiza cabeçalho
      if (paciente) {
        const cEl = document.getElementById('paciente-header-cuidador');
        const nEl = document.getElementById('paciente-header-nome');
        if (cEl) cEl.textContent = 'Cuidador: ' + paciente.cuidador;
        if (nEl) nEl.textContent = paciente.nome;
      }

      const notifs = ZeloStore.getPatientNotifications(patId);
      const filtradas = filtroAtual === 'todos' 
        ? notifs 
        : notifs.filter(n => n.tipo === filtroAtual || (filtroAtual === 'alerta' && n.tipo === 'esas_pendente'));

      if (filtradas.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 36px 20px;">
            <h3 style="color: var(--zelo-primary); margin-bottom: 8px;">Nenhum aviso no momento</h3>
            <p class="text-muted" style="margin-bottom: 0;">
              Você está em dia com todas as orientações da sua equipe de cuidados paliativos.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtradas.map(n => {
        // 1. Lembrete de ESAS Pendente
        if (n.tipo === 'esas_pendente') {
          return `
            <div class="notif-card" style="border-left: 5px solid var(--zelo-warning); background: #FFFDF5;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <strong style="color: var(--zelo-text); font-size: 1.1rem;">${n.titulo}</strong>
                <span class="badge badge-novo">Pendente</span>
              </div>
              <p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px; color: var(--zelo-text);">
                ${n.conteudo}
              </p>
              <a href="sintomas-passos.html" class="btn btn-primary btn-elderly" style="width: 100%; text-align: center;">
                Registrar Sintomas de Hoje (ESAS)
              </a>
            </div>
          `;
        }

        // 2. Mensagens e Orientações da Equipe Médica
        if (n.tipo === 'equipe') {
          return `
            <div class="notif-card success" style="border-left: 5px solid var(--zelo-success); background: #F6FBF7;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 4px;">
                <div>
                  <strong style="color: var(--zelo-success); font-size: 1.1rem; display: block;">${n.titulo}</strong>
                  <span class="text-muted text-small">${n.subtitulo}</span>
                </div>
                <span class="badge badge-tratado">Equipe Assistencial</span>
              </div>
              <p style="font-size: 1rem; line-height: 1.6; margin-bottom: 12px; color: var(--zelo-text); background: #FFFFFF; padding: 12px; border-radius: 8px; border: 1px solid var(--zelo-border);">
                ${n.conteudo}
              </p>
              ${n.conduta ? `
                <div style="font-size: 0.9rem; color: var(--zelo-primary); margin-bottom: 12px;">
                  <strong>Plano Recomendado:</strong> ${n.conduta}
                </div>
              ` : ''}
              <button type="button" class="btn btn-secondary btn-elderly" style="width: 100%;" onclick="alert('Orientação confirmada! Sua equipe sabe que você leu esta mensagem.');">
                Confirmar Leitura da Orientação
              </button>
            </div>
          `;
        }

        // 3. Lembretes de Remédios
        if (n.tipo === 'medicamento') {
          if (n.ehResgate) {
            return `
              <div class="notif-card urgent" style="border-left: 5px solid var(--zelo-danger); background: #FFF5F5;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 4px;">
                  <div>
                    <strong style="color: var(--zelo-danger); font-size: 1.15rem; display: block;">${n.titulo}</strong>
                    <span class="badge badge-grave" style="margin-top: 4px; display: inline-block;">SOS / Dor Intensa</span>
                  </div>
                  <span class="text-muted text-small">${n.subtitulo}</span>
                </div>
                <p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px;">
                  ${n.conteudo}
                </p>
                <button type="button" class="btn btn-danger btn-elderly" style="width: 100%;" onclick="registrarDoseResgate()">
                  + Registrar Tomada da Dose de Resgate
                </button>
              </div>
            `;
          }

          return `
            <div class="notif-card" style="border-left: 5px solid ${n.aplicado ? 'var(--zelo-success)' : 'var(--zelo-primary)'};">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 4px;">
                <div>
                  <strong style="color: var(--zelo-text); font-size: 1.15rem; display: block;">${n.titulo}</strong>
                  <span class="text-muted text-small">${n.subtitulo}</span>
                </div>
                <span class="badge ${n.aplicado ? 'badge-tratado' : 'badge-novo'}">
                  ${n.aplicado ? 'Tomado Hoje' : 'Programado'}
                </span>
              </div>
              <p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px;">
                ${n.conteudo}
              </p>
              <div style="display: flex; gap: 8px;">
                <button type="button" class="btn ${n.aplicado ? 'btn-secondary' : 'btn-primary'} btn-elderly" style="width: 100%;" ${n.aplicado ? 'disabled' : ''} onclick="confirmarTomadaRemedio(${n.medId})">
                  ${n.aplicado ? 'Dose Confirmada no Prontuário' : 'Confirmar Ingestão do Remédio'}
                </button>
              </div>
            </div>
          `;
        }

        // 4. Alertas Clínicos
        if (n.tipo === 'alerta') {
          const isUrgente = n.prioridade === 'urgente';
          const isRevisao = n.estado === 'Em revisao';
          const isTratado = n.estado === 'Tratado';

          return `
            <div class="notif-card ${isUrgente ? 'urgent' : ''}" style="border-left: 5px solid ${isTratado ? 'var(--zelo-success)' : (isRevisao ? 'var(--zelo-warning)' : 'var(--zelo-danger)')};">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 4px;">
                <strong style="color: ${isUrgente ? 'var(--zelo-danger)' : 'var(--zelo-text)'}; font-size: 1.1rem;">${n.titulo}</strong>
                <span class="badge ${isTratado ? 'badge-tratado' : (isRevisao ? 'badge-revisao' : 'badge-novo')}">${n.estado}</span>
              </div>
              <p class="text-small text-muted" style="margin-bottom: 8px;">${n.subtitulo}</p>
              <p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px;">
                ${n.conteudo}
              </p>
              <a href="chatbot-zelo.html" class="btn btn-secondary btn-elderly" style="width: 100%; text-align: center;">
                Ver Avaliação e Triagem da Dor
              </a>
            </div>
          `;
        }

        return '';
      }).join('');
    }

    function confirmarTomadaRemedio(medId) {
      const patId = getPatientId();
      const med = ZeloStore.confirmMedicationDose(patId, medId);
      if (med) {
        renderNotificacoes();
        alert('Ingestão de ' + med.nome + ' confirmada! A informação foi transmitida em tempo real para a equipe de saúde.');
      }
    }

    function registrarDoseResgate() {
      if (confirm('Confirma a tomada da Dose de Resgate para dor aguda intensa? Esta informação será comunicada com prioridade à sua equipe médica.')) {
        const patId = getPatientId();
        ZeloStore.addRescueDoseRecord(patId);
        renderNotificacoes();
        alert('Dose de resgate registrada! O plantão de enfermagem foi alertado.');
      }
    }

    // Configuração dos Botões de Filtro
    document.querySelectorAll('.notif-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.notif-filter-btn').forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary');
        });
        btn.classList.add('btn-primary');
        btn.classList.remove('btn-secondary');
        filtroAtual = btn.dataset.filtro;
        renderNotificacoes();
      });
    });

    // Reatividade em Tempo Real (atualiza quando a equipe médica altera algo)
    window.addEventListener('storage', () => {
      ZeloStore.loadFromStorage();
      renderNotificacoes();
    });

    window.addEventListener('zelo:data-changed', () => {
      renderNotificacoes();
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderNotificacoes();
    });
  </script>
</body>
</html>
