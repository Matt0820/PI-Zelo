<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Zelo - Cuidado e Alivio da Dor | Zelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/zelo-design-system.css">
  <link rel="stylesheet" href="../styles/paciente.css">
  <link rel="stylesheet" href="../styles/high-contrast.css?v=7" data-zelo-high-contrast-styles>
</head>
<body style="background-color: var(--zelo-bg);">

  <div class="paciente-container">
    <!-- Header -->
    <header class="paciente-header">
      <div class="paciente-header-titles">
        <p>Direcionamento de Cuidado</p>
        <h1>Chatbot Zelo · Dor</h1>
      </div>
      <div>
        <a href="index.html" class="btn btn-secondary" style="min-height: 38px; padding: 4px 12px; font-size: 0.85rem; color: #FFFFFF; background: transparent; border-color: rgba(255,255,255,0.4);">
          Voltar
        </a>
      </div>
    </header>

    <main class="paciente-body">
      <!-- Container do Chatbot com o Script Validado -->
      <div id="zelo-chat-app"></div>
    </main>
  </div>

  <script src="../scripts/acessibilidade.js"></script>
  <script src="../scripts/zelo-store.js"></script>
  <script src="../scripts/chatbot-zelo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const intensidade = parseInt(params.get('dor') || '8', 10);
      const patId = parseInt(params.get('patientId') || localStorage.getItem('zelo_selected_patient_id') || '1', 10);
      const paciente = ZeloStore.getPatientById(patId);
      const patName = paciente ? paciente.nome : 'Sr. Leovegildo';

      new ChatbotZeloController('zelo-chat-app', {
        patientId: patId,
        patientName: patName,
        intensidadeDor: intensidade
      });
    });
  </script>
</body>
</html>
