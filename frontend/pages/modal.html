<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleção de Paciente | Zelo</title>

  <!-- Tipografia Oficial Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Estrutura do dispositivo mobile com as mesmas dimensões das telas anteriores -->
  <main class="device-screen">
    
    <!-- Fundo de sobreposição escurecido (Backdrop) -->
    <div class="screen-backdrop">
      
      <!-- Cartão / Caixa do Modal Centralizado -->
      <section class="patient-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        
        <!-- Cabeçalho -->
        <header class="modal-header">
          <h1 id="modalTitle" class="modal-title">Seleção de paciente</h1>
          <button type="button" class="btn-close" id="btnClose" aria-label="Fechar modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </header>

        <!-- Barra de Ordenação / Filtro -->
        <div class="filter-bar">
          <button type="button" class="btn-filter" aria-label="Ordenar por nome">
            <span>Nome</span>
            <i class="fa-solid fa-arrow-down-short-wide"></i>
          </button>
        </div>

        <!-- Lista de Pacientes -->
        <ul class="patient-list" id="patientList">
          <li>
            <button type="button" class="patient-item">Paciente Adipsum</button>
          </li>
          <li>
            <button type="button" class="patient-item">Paciente Lorem Ipsum</button>
          </li>
          <li>
            <button type="button" class="patient-item">Paciente Sit Amet</button>
          </li>
          <li>
            <button type="button" class="patient-item">Paciente 4</button>
          </li>
        </ul>

        <!-- Rodapé de Ações -->
        <footer class="modal-footer" id="modalFooter">
          <button type="button" class="btn btn-cancel hidden" id="btnCancel">Cancelar</button>
          <button type="button" class="btn btn-confirm disabled" id="btnConfirm" disabled>Confirmar</button>
        </footer>

      </section>

    </div>

  </main>

  <!-- Script para alternar os estados interactivos (inicial, selecionado e cancelado) -->
  <script>
    const patientButtons = document.querySelectorAll('.patient-item');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnCancel = document.getElementById('btnCancel');
    const btnClose = document.getElementById('btnClose');
    const modalFooter = document.getElementById('modalFooter');

    patientButtons.forEach(button => {
      button.addEventListener('click', () => {
        const isAlreadySelected = button.classList.contains('selected');

        // Limpa a seleção anterior
        patientButtons.forEach(b => b.classList.remove('selected'));

        if (!isAlreadySelected) {
          // Seleciona o paciente atual
          button.classList.add('selected');
          btnConfirm.disabled = false;
          btnConfirm.classList.remove('disabled');
          btnCancel.classList.remove('hidden');
          modalFooter.classList.add('dual-action');
        } else {
          resetSelection();
        }
      });
    });

    function resetSelection() {
      patientButtons.forEach(b => b.classList.remove('selected'));
      btnConfirm.disabled = true;
      btnConfirm.classList.add('disabled');
      btnCancel.classList.add('hidden');
      modalFooter.classList.remove('dual-action');
    }

    btnCancel.addEventListener('click', resetSelection);
    btnClose.addEventListener('click', resetSelection);
  </script>

</body>
</html>
