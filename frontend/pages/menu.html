<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelo | Navegação</title>

  <!-- Tipografia Nunito (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Folha de estilo externa -->
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../styles/menu.css">
  <link rel="stylesheet" href="../styles/high-contrast.css?v=7" data-zelo-high-contrast-styles>
</head>
<body>

  <!-- Menu Drawer / Navegação Lateral -->
  <aside class="nav-drawer" role="navigation" aria-label="Navegação Principal">
    
    <!-- Título da Seção -->
    <h1 class="drawer-title">Navegação</h1>

    <!-- Card de Identificação do Paciente / Responsável -->
    <div class="user-status-card">
      <div class="user-status-header">
        <div class="user-badge">
          <span class="user-badge-role">Nome do Responsável</span>
          <span class="user-badge-name">Nome do Paciente</span>
        </div>
        <button type="button" class="btn-dismiss" aria-label="Fechar menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <!-- Área de expansão/resumo inferior do card -->
      <div class="user-status-body"></div>
    </div>

    <!-- Lista de Links -->
    <nav class="nav-links">
      <ul>
        <li>
          <a href="#inicio" class="nav-link-item active">
            <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
            <span class="nav-label">INÍCIO</span>
          </a>
        </li>
        <li>
          <a href="#pacientes" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-user-group"></i></span>
            <span class="nav-label">PACIENTES</span>
          </a>
        </li>
        <li>
          <a href="#sintomas" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-person-walking"></i></span>
            <span class="nav-label">SINTOMAS</span>
          </a>
        </li>
        <li>
          <a href="#local-dor" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-bullseye"></i></span>
            <span class="nav-label">LOCAL DE DOR</span>
          </a>
        </li>
        <li>
          <a href="#medicacoes" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-capsules"></i></span>
            <span class="nav-label">MEDICAÇÕES</span>
          </a>
        </li>
        <li>
          <a href="#configuracoes" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
            <span class="nav-label">CONFIGURAÇÕES</span>
          </a>
        </li>
        <li>
          <a href="#sobre" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-circle-info"></i></span>
            <span class="nav-label">SOBRE ZELO</span>
          </a>
        </li>
        <li>
          <a href="#logout" class="nav-link-item">
            <span class="nav-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
            <span class="nav-label">SAIR / LOGOUT</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Botão de Ação / Rodapé (info / cta) -->
    <div class="drawer-footer">
      <button type="button" class="btn-cta">info / cta</button>
    </div>

  </aside>

  <script src="../scripts/acessibilidade.js"></script>
</body>
</html>
