<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E968C">
    <title>Home | Zelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./styles/home.css"
</head>

<body>
    <header>
        <div class="logoContainer">
            <img src="./images/logo.png" alt="Logo Zelo" class="logo">
        </div>
        <div class="headerContent">
            <h6>Nome do Responsável</h6>
            <h3>Nome do Paciente</h3>
        </div>
        <div class="rightHeaderContent">
            <span class="notificationIcon">
                <i class="fa-solid fa-bell"></i>
            </span>
            <span class="menuIcon">
                <i class="fa-solid fa-bars"></i>
            </span>
        </div>
    </header>
    <nav class="direcionamentoDeCuidado">
        <p>Direcionamento de Cuidados:</p>
    </nav>
    <div class="twoBoxContent">
        <div class="box1">
            <h3>Sintomas</h3>
            <div class="barraSintomas"></div>
        </div>
        <div class="box2">
            <img src="" alt="">
        </div>
    </div>
    <script src="https://kit.fontawesome.com/fdcb33e12e.js" crossorigin="anonymous"></script>

</html>
